<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  // Set before the first paint. The host sends the authoritative choice a
  // moment later, but by then the window must already be the right colour —
  // a flash of the wrong theme is the most visible way to look unfinished.
  document.documentElement.dataset.theme =
    matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
</script>
<link rel="stylesheet" href="app.css" />
<title>Dotswitch</title>
</head>
<body>
  <!-- Custom chrome. The window itself is frameless, so this bar is the title
       bar: dragging it moves the window, and these are the real controls. -->
  <header class="titlebar" id="titlebar">
    <img class="logo" src="dotswitch.png" alt="" draggable="false" />
    <span class="brand">Dotswitch</span>
    <span class="count" id="count"></span>
    <span class="grow"></span>
    <button class="wb" id="btnTheme" data-tip="Theme" aria-label="Theme"></button>
    <button class="wb" id="btnPin" data-tip="Keep on top" aria-label="Keep on top"></button>
    <button class="wb" id="btnMin" data-tip="Minimise" aria-label="Minimise"></button>
    <button class="wb danger" id="btnClose" data-tip="Close" aria-label="Close"></button>
  </header>

  <div class="shell">
    <div class="toolbar">
      <div class="search">
        <span class="search-icon" id="searchIcon"></span>
        <input type="search" id="filter" class="filter" placeholder="Filter" aria-label="Filter projects" />
      </div>
      <span class="grow"></span>
      <button class="ib" id="btnAdd" data-tip="Add a project" aria-label="Add a project"></button>
      <button class="ib" id="btnStrays" data-tip="Terminate stray processes" aria-label="Terminate stray processes"></button>
      <button class="ib soft-halt" id="btnStopAll" data-tip="Stop everything" aria-label="Stop everything"></button>
    </div>

    <div class="scroll" id="scroll"></div>

    <div id="empty" class="empty" hidden>
      <span class="empty-mark" id="emptyMark"></span>
      <strong>Nothing here yet</strong>
      <p>
        Press <b>+</b> to add a project, or right-click one in VS Code and
        choose <b>Run</b>. It stays in this list from then on.
      </p>
    </div>

    <footer class="credit">
      Developed by <a href="#" id="author">Siam Ahnaf</a>
    </footer>
  </div>

  <!-- One floating tooltip, moved and filled on hover. -->
  <div class="tip" id="tip" role="tooltip" aria-hidden="true"></div>

  <!-- Shown while running projects are being shut down on close. -->
  <div class="veil" id="veil" hidden>
    <div class="veil-spin" id="veilSpin"></div>
    <div class="veil-text" id="veilText">Stopping…</div>
  </div>

  <!-- Resize grips. The window has no non-client frame left, so these strips
       are what let Windows start an edge drag. -->
  <div class="rz n"  data-edge="n"></div>
  <div class="rz s"  data-edge="s"></div>
  <div class="rz w"  data-edge="w"></div>
  <div class="rz e"  data-edge="e"></div>
  <div class="rz nw" data-edge="nw"></div>
  <div class="rz ne" data-edge="ne"></div>
  <div class="rz sw" data-edge="sw"></div>
  <div class="rz se" data-edge="se"></div>

  <script src="app.js"></script>
</body>
</html>
